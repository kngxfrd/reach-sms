<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 940" width="520" height="940" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif">
  <defs>
    <clipPath id="screen">
      <rect x="74" y="54" width="372" height="832" rx="48"/>
    </clipPath>
    <linearGradient id="wall" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0a0e2e"/>
      <stop offset="0.55" stop-color="#2a0f55"/>
      <stop offset="1" stop-color="#5a1260"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6bf27f"/>
      <stop offset="1" stop-color="#0bbf2c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3f52"/>
      <stop offset="0.5" stop-color="#1b1d28"/>
      <stop offset="1" stop-color="#34384a"/>
    </linearGradient>
    <symbol id="arrow" viewBox="0 0 24 24">
      <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3.5,18 9,12.5 12.5,16 19.5,8.5"/>
        <polyline points="14.5,7.5 20,7.5 20,13"/>
      </g>
    </symbol>
  </defs>

  <!-- side buttons -->
  <rect x="56" y="170" width="4" height="46" rx="2" fill="#2a2d3b"/>
  <rect x="56" y="236" width="4" height="70" rx="2" fill="#2a2d3b"/>
  <rect x="460" y="220" width="4" height="96" rx="2" fill="#2a2d3b"/>

  <!-- phone body -->
  <rect x="60" y="40" width="400" height="860" rx="62" fill="url(#body)"/>
  <rect x="60" y="40" width="400" height="860" rx="62" fill="none" stroke="#6b7088" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="70" y="50" width="380" height="840" rx="54" fill="#05060a"/>

  <!-- screen -->
  <g clip-path="url(#screen)">
    <rect x="74" y="54" width="372" height="832" fill="url(#wall)"/>
    <circle cx="420" cy="140" r="150" fill="#e8453c" fill-opacity="0.12"/>
    <circle cx="90" cy="800" r="190" fill="#f08a2c" fill-opacity="0.10"/>

    <!-- status bar -->
    <g fill="#fff" fill-opacity="0.9">
      <rect x="372" y="80" width="4" height="6" rx="1"/>
      <rect x="379" y="77" width="4" height="9" rx="1"/>
      <rect x="386" y="74" width="4" height="12" rx="1"/>
      <rect x="400" y="73" width="26" height="13" rx="4" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="1.3"/>
      <rect x="402.5" y="75.5" width="17" height="8" rx="2"/>
    </g>

    <!-- camera hole -->
    <circle cx="260" cy="80" r="8" fill="#000"/>
    <circle cx="260" cy="80" r="3" fill="#141a33"/>

    <!-- date & time -->
    <text x="260" y="140" font-size="17" fill="#fff" fill-opacity="0.85" text-anchor="middle">Monday, 9 November</text>
    <text x="260" y="222" font-size="86" fill="#fff" text-anchor="middle" font-weight="300" letter-spacing="-2">13:46</text>

    <!-- notification 1 -->
    <g transform="translate(90,596)">
      <rect width="340" height="86" rx="22" fill="#fff" fill-opacity="0.17" stroke="#fff" stroke-opacity="0.14"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="url(#brand)"/>
      <text x="34" y="42" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">C</text>
      <text x="66" y="30" font-size="15" font-weight="700" fill="#fff">Campaign</text>
      <text x="326" y="30" font-size="12" fill="#fff" fill-opacity="0.6" text-anchor="end">now</text>
      <text x="66" y="52" font-size="13" fill="#fff" fill-opacity="0.92">Vote for Reach as the best bulk</text>
      <text x="66" y="70" font-size="13" fill="#fff" fill-opacity="0.92">SMS platform.</text>
    </g>

    <!-- notification 2 -->
    <g transform="translate(90,690)">
      <rect width="340" height="86" rx="22" fill="#fff" fill-opacity="0.17" stroke="#fff" stroke-opacity="0.14"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="url(#brand)"/>
      <text x="34" y="42" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">R</text>
      <text x="66" y="30" font-size="15" font-weight="700" fill="#fff">Reach</text>
      <text x="326" y="30" font-size="12" fill="#fff" fill-opacity="0.6" text-anchor="end">2m ago</text>
      <text x="66" y="52" font-size="13" fill="#fff" fill-opacity="0.92">Visit Reach to send bulk SMS to a</text>
      <text x="66" y="70" font-size="13" fill="#fff" fill-opacity="0.92">lot of recipients.</text>
    </g>

    <!-- bottom shortcuts -->
    <circle cx="120" cy="824" r="22" fill="#fff" fill-opacity="0.16"/>
    <circle cx="400" cy="824" r="22" fill="#fff" fill-opacity="0.16"/>
    <g fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M113 816 h14 l-3 8 h-8 z"/>
      <path d="M116 824 v10 h8 v-10"/>
      <rect x="390" y="817" width="20" height="14" rx="3"/>
      <circle cx="400" cy="824" r="3.5"/>
    </g>

    <!-- home indicator -->
    <rect x="212" y="868" width="96" height="5" rx="2.5" fill="#fff" fill-opacity="0.8"/>
  </g>
</svg>
